name: RaceDay CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Cancel an older run of the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  API_PROJECT: Part 2/Part 2.csproj
  MVC_PROJECT: RaceDayMVC/RaceDayMVC.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------
  # CI 1: build and test the Part 2 API
  # ---------------------------------------------------------------
  api:
    name: Build and test API (Part 2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.API_PROJECT }}" --no-restore -c Release

      - name: Test
        run: dotnet test "${{ env.API_PROJECT }}" --no-build -c Release --logger "trx;LogFileName=api-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # CI 2: build the Part 3 MVC project
  # ---------------------------------------------------------------
  mvc:
    name: Build MVC application (Part 3)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.MVC_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.MVC_PROJECT }}" --no-restore -c Release

      - name: Publish
        run: dotnet publish "${{ env.MVC_PROJECT }}" --no-build -c Release -o publish/mvc

      - name: Upload published MVC application
        uses: actions/upload-artifact@v4
        with:
          name: raceday-mvc
          path: publish/mvc
          retention-days: 7

  # ---------------------------------------------------------------
  # CI 3: make sure the Docker image builds
  # ---------------------------------------------------------------
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [ mvc ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./RaceDayMVC
          push: false
          tags: raceday-mvc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # CD: publish the Docker image to GitHub Container Registry
  # Runs only on pushes to main/master, after everything above passed
  # ---------------------------------------------------------------
  publish-image:
    name: Publish Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: [ api, mvc, docker-build ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creates lower-case image names and tags (latest + commit SHA)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/raceday-mvc
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./RaceDayMVC
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
